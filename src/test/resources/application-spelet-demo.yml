env:
  parallelism:
    strategy: fixed
    threads: 4
  api:
    baseUrl: https://demo.spelet.lv
  browser:
    name: chromium
    headless: true
    language: lv
    defaultLanguage: lv
    languages:
      - lv
      - ru
      - en
  retries:
    enabled: true
    count: 2
  testDevices:
    platforms:
      - name: "Desktop FullHD"
        width: 1920
        height: 1080
