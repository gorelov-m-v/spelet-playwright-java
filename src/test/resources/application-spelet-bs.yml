env:
  parallelism:
    strategy: fixed
    threads: 1
  retries:
    enabled: true
    count: 2
  api:
    baseUrl: https://spelet.lv
  browser:
    name: chromium
    headless: true
    language: lv
    defaultLanguage: lv
    languages:
      - lv
      - ru
      - en
  browserstack:
    os: Windows
    osVersion: "10"
    browser: chrome
    browserVersion: latest
    project: "Spelet LV"
    name: "Spelet test"
  testDevices:
    platforms:
      - name: "Desktop FullHD"
        width: 1920
        height: 1080
