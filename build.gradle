buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.yaml:snakeyaml:2.2' }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'io.qameta.allure' version '2.12.0'
}

import org.yaml.snakeyaml.Yaml

group = 'com.example'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2023.0.3'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'com.vaadin.external.google', module: 'android-json'
    }

    // Needed for SpringExtension used in main test framework classes
    implementation 'org.springframework:spring-test'

    implementation 'com.microsoft.playwright:playwright:1.48.0'
    implementation 'org.json:json:20240303'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-core'

    // OpenFeign
    compileOnly 'org.springframework.cloud:spring-cloud-starter-openfeign'
    compileOnly 'io.github.openfeign:feign-okhttp'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    testImplementation 'io.github.openfeign:feign-okhttp'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // JUnit API needed for main framework classes such as extensions
    implementation platform('org.junit:junit-bom:5.10.0')
    implementation 'org.junit.jupiter:junit-jupiter-api'
    implementation 'org.junit.jupiter:junit-jupiter-params'

    // Allure commons used by framework utilities and listeners
    implementation 'io.qameta.allure:allure-java-commons:2.29.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    testImplementation 'io.qameta.allure:allure-junit5:2.29.0'
    testImplementation 'io.github.artsok:rerunner-jupiter:2.1.6'
    testRuntimeOnly 'org.aspectj:aspectjweaver:1.9.22.1'
}

tasks.register('playwrightInstall', JavaExec) {
    group = 'verification'
    description = 'Install Playwright browsers'
    mainClass = 'com.microsoft.playwright.CLI'
    classpath = sourceSets.test.runtimeClasspath
    args 'install'
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties = System.getProperties() as Map<String, ?>
    jvmArgs '-Dfile.encoding=UTF-8', '--add-opens=java.base/java.lang=ALL-UNNAMED'
    dependsOn(playwrightInstall)

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }

    doFirst {
        def activeProfile = System.getProperty('spring.profiles.active')
        if (!activeProfile) {
            activeProfile = systemProperties['spring.profiles.active']
        }

        if (activeProfile == null || activeProfile.trim().isEmpty()) {
            throw new GradleException("ERROR: Spring profile is not set. Please run tests with -Dspring.profiles.active=<profile-name>")
        }

        def configFileName = "src/test/resources/application-${activeProfile}.yml"
        def configFile = file(configFileName)

        if (!configFile.exists()) {
            throw new GradleException("ERROR: Configuration file not found for profile '${activeProfile}'. Expected path: ${configFileName}")
        }

        def yaml = new Yaml()
        def config = yaml.load(configFile.newDataInputStream())

        def parallelismConfig = config?.env?.parallelism
        if (parallelismConfig) {
            def threads = parallelismConfig.threads.toString()
            def strategy = parallelismConfig.strategy

            systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
            systemProperty 'junit.jupiter.execution.parallel.config.strategy', strategy
            if (strategy == 'fixed') {
                systemProperty 'junit.jupiter.execution.parallel.config.fixed.parallelism', threads
            }
        }

        def retriesConfig = config?.env?.retries
        def repeats = '1'
        if (retriesConfig && retriesConfig.enabled && retriesConfig.count) {
            repeats = retriesConfig.count.toString()
        }
        systemProperty 'totalRepeats', repeats
    }
}

tasks.named('test') {
    systemProperty 'spring.profiles.include', 'local'
}
allure {
    version = '2.29.0'
    adapter {
        autoconfigure = true
        aspectjWeaver = true
        frameworks { junit5 { enabled = true } }
    }
}


